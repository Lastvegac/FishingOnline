# Signed callbacks and return URLs must not put query strings in access logs.
log_format fwo_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log fwo_safe;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html/web;
  index index.html;
  server_tokens off;
  client_max_body_size 128k;
  include /etc/nginx/security-headers.conf;
  location = /api/v1/payments/socket {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}

server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html/admin;
  index index.html;
  server_tokens off;
  client_max_body_size 128k;
  include /etc/nginx/security-headers.conf;
  # Photo bytes are submitted atomically with fish create/edit only.
  location ~ "^/api/v1/admin/fish(?:/[0-9a-f-]{36})?$" {
    client_max_body_size 8m;
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
}
