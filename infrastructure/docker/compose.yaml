name: fishing-world-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fishing_world
      POSTGRES_USER: fwo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fwo_local_only}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fwo -d fishing_world']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:51025:1025'
      - '127.0.0.1:58025:8025'
volumes:
  postgres-data:
  redis-data:
