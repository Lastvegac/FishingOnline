name: Quality checks
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fwo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fishing_world
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fwo -d fishing_world"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://fwo:ci-only-password@127.0.0.1:5432/fishing_world
      TEST_DATABASE_URL: postgresql://fwo:ci-only-password@127.0.0.1:5432/fishing_world_test
      E2E_DATABASE_URL: postgresql://fwo:ci-only-password@127.0.0.1:5432/fishing_world_e2e_test
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      JWT_SECRET: ci-ephemeral-secret-only-not-a-production-credential
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: psql "$DATABASE_URL" -c 'CREATE DATABASE fishing_world_test'
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          path: |
            playwright-report
            test-results
          retention-days: 7
      # Deployment intentionally lives outside this quality workflow.
      # A production workflow needs GitHub Environment reviewers and release/legal gates.
